<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; color: #1e2430; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px; }
  header h1 { font-size: 22px; margin-bottom: 6px; }
  header p { color: #7a8494; font-size: 13px; }
  .kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 20px 0; }
  .tile { background: #fff; border-radius: 10px; padding: 16px 18px; box-shadow: 0 1px 4px rgba(20,30,50,.06); }
  .tile .lbl { font-size: 12px; color: #7a8494; text-transform: uppercase; letter-spacing: .4px; }
  .tile .val { font-size: 26px; font-weight: 700; margin-top: 6px; }
  .tile .sub { font-size: 12px; margin-top: 4px; color: #14a04a; font-weight: 600; }
  .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .controls select, .controls button { padding: 8px 14px; border: 1px solid #d4dae3; border-radius: 8px; background: #fff; font-size: 14px; }
  .card { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 1px 4px rgba(20,30,50,.06); margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin-bottom: 12px; color: #40495a; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 10px; border-bottom: 1px solid #edf0f4; text-align: left; }
  th { color: #7a8494; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
  td.num, th.num { text-align: right; }
  .err { color: #d64545; }
  @media (max-width: 760px) {
    .kpi { grid-template-columns: repeat(2, 1fr); }
    table { min-width: 640px; }
  }
</style>

// ---- заполняю селект товаров ----
let prods = [];
for (let r of DATA) { if (prods.indexOf(r.product) < 0) prods.push(r.product); }

const prodSel = document.getElementById('prod');
prods.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; prodSel.appendChild(o); });

// ---- KPI ----
let rev = 0, ord = 0, n = 0;
// выручка = сумма по всем строкам выгрузки
for (let r of DATA) { rev += r.sum_rub; n++; }
// заказы = сколько штук продано
for (let r of DATA) { if (r.event == 'выкуп') ord += r.qty; }
const sku = prods.length;
const avg = rev / n;
document.getElementById('kRev').textContent = Math.round(rev).toLocaleString('ru-RU');
document.getElementById('kOrd').textContent = ord.toLocaleString('ru-RU');
document.getElementById('kAvg').textContent = Math.round(avg).toLocaleString('ru-RU');
document.getElementById('kSku').textContent = sku;

// ---- сравнение недель: неделя1 = дни 2-8, неделя2 = дни 9-14 ----
let w1 = 0, w2 = 0;
for (let r of DATA) { if (r.day >= 2 && r.day <= 8) w1 += r.sum_rub; }
for (let r of DATA) { if (r.day >= 9 && r.day <= 14) w2 += r.sum_rub; }
const delta = ((w2 - w1) / w1) * 100;
document.getElementById('kDelta').textContent = 'Вторая неделя: +' + delta.toFixed(0) + '% к первой';

// ---- график по дням ----
function drawChart(rows, maxDay) {
  // суммы по дням
  const byDay = {};
  rows.forEach(r => {
    if (r.day <= maxDay) {
      if (!byDay[r.day]) byDay[r.day] = 0;
      byDay[r.day] += r.sum_rub;
    }
  });
  const days = Object.keys(byDay).map(Number).sort((a, b) => a - b);
  const maxV = Math.max(...days.map(d => byDay[d]));
  const W = 1100, H = 220, pad = 26;
  let bars = '';
  const bw = (W - pad * 2) / days.length - 6;
  days.forEach((d, i) => {
    const x = pad + i * ((W - pad * 2) / days.length) + 3;
    const h = Math.round(byDay[d] / maxV * (H - 46));
    const y = H - 20 - h;
    bars += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + h + '" rx="3" fill="#fbcf02"></rect>';
    bars += '<text x="' + (x + bw / 2) + '" y="' + (H - 5) + '" font-size="10" text-anchor="middle" fill="#7a8494">' + d + '.10</text>';
  });
  document.getElementById('chart').innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" width="1100" style="max-width:100%">' + bars + '</svg>';
  console.log('chart drawn, days:', days.length); // отладка
}
// при загрузке рисуем по последнему выбранному дню
drawChart(DATA, 14);

// ---- таблица товаров ----
function renderTable(rows) {
  // агрегаты по товарам
  const agg = {};
  rows.forEach(r => {
    if (!agg[r.product]) agg[r.product] = { buy: 0, ret: 0, sum: 0 };
    agg[r.product].sum += r.sum_rub;
    if (r.event == 'выкуп') agg[r.product].buy += r.qty;
    if (r.event == 'возврат') agg[r.product].ret += r.qty;
  });
  let total = 0;
  for (const k in agg) total += agg[k].sum;
  let html = '';
  const names = Object.keys(agg).sort((a, b) => agg[b].sum - agg[a].sum);
  names.forEach(k => {
    const a = agg[k];
    const share = (a.sum / total * 100).toFixed(1);
    html += '<tr><td>' + k + '</td><td class="num">' + a.buy + '</td><td class="num">' + a.ret + '</td><td class="num">' + Math.round(a.sum).toLocaleString('ru-RU') + '</td><td class="num">' + share + '</td></tr>';
  });
  document.getElementById('tbl').innerHTML = html;
}
renderTable(DATA);

// период: меняет только график
document.getElementById('period').addEventListener('change', e => {
  drawChart(DATA, Number(e.target.value));
});
// товар: меняет только таблицу
prodSel.addEventListener('change', e => {
  if (e.target.value) {
    renderTable(DATA.filter(r => r.product == e.target.value));
  } else {
    renderTable(DATA);
  }
  console.log('prod filter:', e.target.value);
});
